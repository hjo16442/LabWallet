name: Android APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build existing online diagnostic app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build isolated offline key-check app
        run: gradle :offline:assembleDebug --no-daemon --stacktrace

      - name: Upload existing LabWallet APK
        uses: actions/upload-artifact@v4
        with:
          name: LabWallet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload offline key-check APK
        uses: actions/upload-artifact@v4
        with:
          name: LabWallet-Offline-TRON-Check
          path: offline/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
